<!DOCTYPE html>
<html lang="en">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: pan-y pinch-zoom;
        }

        :root {
            --pure-black: #000000;
            --pure-white: #FFFFFF;
            --zinc-50: #fafafa;
            --zinc-100: #f4f4f5;
            --zinc-200: #e4e4e7;
            --zinc-300: #d4d4d8;
            --zinc-400: #a1a1aa;
            --zinc-500: #71717a;
            --zinc-600: #52525b;
            --zinc-700: #3f3f46;
            --zinc-800: #27272a;
            --zinc-900: #18181b;
            --zinc-950: #09090b;
            --primary-color: #8b5cf6;
            --secondary-color: #3b82f6;
            --accent-color: #10b981;
            --danger-color: #ef4444;
            --warning-color: #f59e0b;
            --squircle-radius: 20px;
            --glass-blur: blur(12px);
            --backdrop-blur: blur(12px);
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-medium: 300ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 500ms cubic-bezier(0.4, 0, 0.2, 1);
            --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-condensed: 'Roboto Condensed', var(--font-primary);
            --header-height: 70px;
            --header-shrink-height: 60px;
            --dock-height: 80px;
        }

        html {
            scroll-behavior: smooth;
            height: 100%;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: var(--font-primary);
            background-color: var(--pure-black);
            color: var(--pure-white);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow-x: hidden;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior-y: auto;
        }

        h1, h2, h3, h4, h5, h6 {
            font-weight: 700;
            letter-spacing: -0.025em;
            line-height: 1.2;
        }

        .condensed {
            font-family: var(--font-condensed);
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .text-gradient {
            background: linear-gradient(90deg, var(--pure-white), var(--zinc-400));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .squircle {
            border-radius: var(--squircle-radius);
        }

        .glass {
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .recessed {
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.05), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .elevated {
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.03), 
                        0 0 0 1px rgba(255, 255, 255, 0.05),
                        0 8px 30px rgba(0, 0, 0, 0.3);
        }

        .outer-glow {
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.1),
                        0 0 40px rgba(255, 255, 255, 0.05);
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: var(--header-height);
            transition: all var(--transition-medium);
            pointer-events: auto;
        }

        .header.shrink {
            height: var(--header-shrink-height);
            background-color: rgba(0, 0, 0, 0.98);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            pointer-events: auto;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: transparent;
        }

        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-logo {
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            font-style: italic;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, var(--pure-white), var(--zinc-300));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: all var(--transition-fast);
        }

        .header.shrink .header-logo {
            font-size: 1.25rem;
        }

        .header.shrink .logo-icon {
            width: 36px;
            height: 36px;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
            pointer-events: auto;
        }

        .coin-display {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 0.875rem;
            font-weight: 600;
            transition: all var(--transition-fast);
            pointer-events: auto;
            cursor: pointer;
        }

        .coin-display:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .coin-display i {
            color: var(--warning-color);
        }

        .user-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--zinc-700), var(--pure-white));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--pure-black);
            cursor: pointer;
            transition: all var(--transition-fast);
            overflow: hidden;
            pointer-events: auto;
        }

        .user-avatar:hover {
            transform: scale(1.05);
        }

        .user-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .level-badge {
            position: absolute;
            bottom: -5px;
            right: -5px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.625rem;
            font-weight: 800;
            color: white;
            border: 2px solid var(--pure-black);
        }

        .main-content {
            padding-top: calc(var(--header-height) + 1.5rem);
            padding-bottom: calc(var(--dock-height) + 2rem);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            padding-left: 1rem;
            padding-right: 1rem;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        @media (min-width: 768px) {
            .main-content {
                padding-left: 2rem;
                padding-right: 2rem;
            }
        }

        .auth-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70vh;
            text-align: center;
            padding: 2rem 0;
        }

        .auth-title {
            font-size: 3.5rem;
            font-weight: 900;
            margin-bottom: 0.5rem;
            letter-spacing: -0.05em;
            background: linear-gradient(to right, var(--pure-white), var(--zinc-400));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .auth-subtitle {
            color: var(--zinc-500);
            font-size: 0.875rem;
            margin-bottom: 2.5rem;
            max-width: 300px;
            line-height: 1.6;
        }

        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 320px;
            position: relative;
            z-index: 10;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            text-align: left;
            position: relative;
            z-index: 10;
        }

        .form-label {
            font-size: 0.75rem;
            color: var(--zinc-400);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            font-weight: 600;
        }

        .form-input {
            padding: 0.875rem 1rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            color: var(--pure-white);
            font-size: 0.875rem;
            transition: all var(--transition-fast);
            font-family: var(--font-primary);
            pointer-events: auto;
            position: relative;
            z-index: 10;
            cursor: text;
            -webkit-user-select: text;
            user-select: text;
            touch-action: manipulation;
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            display: block;
        }

        .form-input:focus {
            outline: none;
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1);
        }

        .form-input::placeholder {
            color: var(--zinc-600);
        }

        .form-input:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .password-requirements {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            margin-top: 0.5rem;
            font-size: 0.75rem;
            color: var(--zinc-500);
        }

        .password-req {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .password-req.valid {
            color: #10b981;
        }

        .password-req i {
            font-size: 0.625rem;
        }

        .auth-toggle {
            text-align: center;
            margin-top: 1.5rem;
            position: relative;
            z-index: 10;
        }

        .auth-toggle-text {
            color: var(--zinc-500);
            font-size: 0.875rem;
        }

        .auth-toggle-button {
            background: none;
            border: none;
            color: var(--pure-white);
            font-weight: 600;
            cursor: pointer;
            margin-left: 0.5rem;
            transition: color var(--transition-fast);
            pointer-events: auto;
        }

        .auth-toggle-button:hover {
            color: var(--zinc-300);
        }

        .shimmer-button {
            position: relative;
            overflow: hidden;
            background: var(--pure-white);
            color: var(--pure-black);
            border: none;
            border-radius: 100px;
            padding: 1rem 2rem;
            font-weight: 700;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            outline: none;
            pointer-events: auto;
            z-index: 10;
        }

        .shimmer-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 255, 255, 0.15),
                        0 0 0 1px rgba(255, 255, 255, 0.3);
        }

        .shimmer-button:active {
            transform: translateY(0);
        }

        .shimmer-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .ghost-button {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--pure-white);
            border-radius: 100px;
            padding: 1rem 2rem;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            transition: all var(--transition-fast);
            width: 100%;
            outline: none;
            pointer-events: auto;
            z-index: 10;
        }

        .ghost-button:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .ghost-button:active {
            transform: translateY(1px);
        }

        .banner {
            background: linear-gradient(135deg, 
                rgba(139, 92, 246, 0.15), 
                rgba(168, 85, 247, 0.1));
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: var(--squircle-radius);
            padding: 1rem 1.25rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            position: relative;
            overflow: hidden;
        }

        .motivation-banner {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), rgba(220, 38, 38, 0.1));
            border: 1px solid rgba(239, 68, 68, 0.3);
            margin-bottom: 0.75rem;
        }

        .motivation-banner .banner-icon {
            color: #ef4444;
        }

        .motivation-banner .banner-title {
            color: #ef4444;
        }

        .banner-content {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            z-index: 1;
            position: relative;
        }

        .banner-icon {
            color: var(--primary-color);
        }

        .banner-text {
            display: flex;
            flex-direction: column;
        }

        .banner-title {
            font-weight: 700;
            font-size: 0.875rem;
        }

        .banner-description {
            font-size: 0.75rem;
            color: var(--zinc-400);
            margin-top: 0.125rem;
            font-variant-numeric: tabular-nums;
        }

        .action-search-bar {
            position: relative;
            margin-bottom: 1.5rem;
            z-index: 10;
        }

        .search-input {
            width: 100%;
            padding: 1rem 1rem 1rem 3rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 100px;
            color: var(--pure-white);
            font-size: 0.875rem;
            box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.05), 
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all var(--transition-fast);
            font-family: var(--font-primary);
            outline: none;
            pointer-events: auto;
            position: relative;
            z-index: 10;
            cursor: text;
            -webkit-user-select: text;
            user-select: text;
            touch-action: manipulation;
            -webkit-appearance: none;
            appearance: none;
        }

        .search-input:focus {
            border-color: rgba(255, 255, 255, 0.5);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.1),
                        inset 0 2px 4px rgba(255, 255, 255, 0.05);
        }

        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--zinc-500);
            pointer-events: none;
            transition: color var(--transition-fast);
            z-index: 11;
        }

        .search-input:focus + .search-icon {
            color: var(--pure-white);
        }

        .search-dropdown {
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 0;
            right: 0;
            background: rgba(20, 20, 20, 0.98);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .search-dropdown.active {
            display: block;
        }

        .search-result-item {
            padding: 1rem;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .search-result-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .search-result-item.highlight-match {
            animation: glowHighlight 2s ease-out;
        }

        @keyframes glowHighlight {
            0% { box-shadow: inset 0 0 0 2px var(--primary-color); }
            100% { box-shadow: inset 0 0 0 0 transparent; }
        }

        .search-result-img {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .search-result-info {
            flex: 1;
            min-width: 0;
        }

        .search-result-title {
            font-weight: 600;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .search-result-desc {
            font-size: 0.75rem;
            color: var(--zinc-500);
        }

        .highlight {
            color: var(--primary-color);
            font-weight: 700;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--zinc-500);
            font-weight: 700;
            margin-bottom: 1rem;
        }

        .offers-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.75rem;
            margin-bottom: 2rem;
        }

        @media (min-width: 640px) {
            .offers-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .offer-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: var(--squircle-radius);
            padding: 1.25rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            cursor: pointer;
            transition: all var(--transition-medium);
            text-align: center;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
        }

        .offer-card:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
            transform: translateY(-4px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2);
        }

        .offer-card.hot-offer {
            border: 2px solid var(--danger-color);
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1), rgba(239, 68, 68, 0.05));
        }

        .offer-card.hot-offer::before {
            content: 'HOT';
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--danger-color);
            color: white;
            font-size: 0.625rem;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
        }

        .offer-icon {
            width: 60px;
            height: 60px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            transition: transform var(--transition-medium);
            margin: 0 auto;
            overflow: hidden;
            background: rgba(255, 255, 255, 0.05);
        }

        .offer-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .offer-label {
            font-weight: 600;
            font-size: 0.875rem;
        }

        .offer-subtext {
            font-size: 0.75rem;
            color: var(--zinc-500);
        }

        .daily-gifts-section {
            margin-bottom: 2rem;
        }

        .daily-gifts-slider {
            position: relative;
            overflow: hidden;
            border-radius: var(--squircle-radius);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            touch-action: pan-y;
        }

        .daily-gifts-container {
            display: flex;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: grab;
        }

        .daily-gifts-container:active {
            cursor: grabbing;
        }

        .daily-gifts-slide {
            min-width: 100%;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
            user-select: none;
        }

        @media (max-width: 640px) {
            .daily-gifts-slide {
                padding: 1rem;
            }
        }

        .gift-media-wrapper {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @media (max-width: 640px) {
            .gift-media-wrapper {
                height: 250px;
            }
        }

        .gift-media-wrapper video,
        .gift-media-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            max-width: 100%;
            max-height: 100%;
        }

        .gift-slider-dots {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
            margin-bottom: 1rem;
            justify-content: center;
        }

        .gift-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: all var(--transition-fast);
        }

        .gift-dot.active {
            background: var(--primary-color);
            width: 24px;
            border-radius: 4px;
        }

        .gifts-title {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            text-align: center;
        }

        .gifts-subtitle {
            color: var(--zinc-500);
            font-size: 0.875rem;
            margin-bottom: 1rem;
            text-align: center;
        }

        .gifts-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.75rem;
            margin: 1rem 0;
        }

        .gift-box {
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
