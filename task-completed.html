<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Complete | RobuxPrize</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest">
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b0c;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #121214;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 3px;
        }

        @keyframes float {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .float-animation {
            animation: float 2.8s ease-in-out infinite;
        }

        @keyframes pop-in {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            70% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        .pop-in {
            animation: pop-in 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        @keyframes shimmer {
            0% {
                background-position: -200% center;
            }
            100% {
                background-position: 200% center;
            }
        }
        .btn-shimmer {
            background: linear-gradient(90deg, #10b981, #34d399, #10b981);
            background-size: 200% auto;
            animation: shimmer 2.5s linear infinite;
        }
        .btn-shimmer:hover {
            animation-duration: 0.8s;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            animation: confetti-fall linear forwards;
            pointer-events: none;
            z-index: 999;
        }

        .confetti-container {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 998;
        }

        .check-circle-bg {
            background: radial-gradient(circle at center, rgba(16, 185, 129, 0.25) 0%, transparent 70%);
        }
    </style>
</head>
<body class="text-gray-100 antialiased custom-scrollbar min-h-screen flex flex-col">

    <!-- ===== TOP NAV – Exact same as original ===== -->
    <nav class="sticky top-0 z-50 border-b border-zinc-800 bg-zinc-950/80 backdrop-blur-md px-4 py-3 lg:px-8">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='http://robuxprize.site/app.html'">
                <div class="bg-red-600 p-2 rounded-xl text-white shadow-lg shadow-red-600/20 animate-pulse">
                    <i data-lucide="ticket" class="w-6 h-6"></i>
                </div>
                <span class="text-xl font-extrabold tracking-tight bg-gradient-to-r from-white to-zinc-400 bg-clip-text text-transparent">Robux<span class="text-red-500">Prize</span></span>
            </div>
            <div class="flex items-center gap-4">
                <div class="bg-zinc-900 border border-zinc-800 rounded-full py-1.5 px-3.5 flex items-center gap-2 shadow-inner">
                    <i data-lucide="check-circle" class="w-4 h-4 text-emerald-500"></i>
                    <span class="text-sm font-bold text-white tracking-wide">Task Done</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- ===== MAIN CONTENT ===== -->
    <main class="flex-1 flex items-center justify-center px-4 py-8">
        <div class="max-w-2xl w-full">

            <!-- ===== SUCCESS CARD ===== -->
            <div class="bg-zinc-950 border border-zinc-900 rounded-3xl p-8 sm:p-12 text-center relative overflow-hidden shadow-2xl shadow-emerald-500/5">

                <!-- Glow -->
                <div class="absolute -top-24 -right-24 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>
                <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-emerald-500/10 rounded-full blur-3xl pointer-events-none"></div>

                <!-- Checkmark -->
                <div class="relative z-10 mx-auto mb-6">
                    <div class="check-circle-bg w-32 h-32 mx-auto rounded-full flex items-center justify-center">
                        <div class="pop-in w-28 h-28 rounded-full bg-gradient-to-br from-emerald-500 to-emerald-700 shadow-xl shadow-emerald-500/30 flex items-center justify-center float-animation">
                            <i data-lucide="check" class="w-16 h-16 text-white stroke-[3]"></i>
                        </div>
                    </div>
                </div>

                <!-- Title -->
                <h1 class="relative z-10 text-4xl sm:text-5xl font-black tracking-tight text-white mb-2 pop-in" style="animation-delay: 0.15s;">
                    🎉 Congrats!
                </h1>
                <p class="relative z-10 text-lg font-medium text-zinc-300 mb-1 pop-in" style="animation-delay: 0.25s;">
                    You successfully completed the task.
                </p>

                <!-- Divider -->
                <div class="relative z-10 w-20 h-1 bg-gradient-to-r from-emerald-500/40 via-emerald-400 to-emerald-500/40 rounded-full mx-auto my-5"></div>

                <!-- Message -->
                <p class="relative z-10 text-sm text-zinc-400 leading-relaxed max-w-sm mx-auto">
                    Your reward has been credited to your account. Keep going — more tasks await you!
                </p>

                <!-- Continue Button -->
                <div class="relative z-10 mt-8">
                    <a href="http://robuxprize.site/app.html"
                    class="btn-shimmer inline-flex items-center gap-2.5 text-white font-extrabold text-sm tracking-wide px-8 py-4 rounded-xl shadow-lg shadow-emerald-600/30 hover:shadow-emerald-500/50 transition-all duration-200 active:scale-95 border border-emerald-400/20">
                    <i data-lucide="arrow-right" class="w-5 h-5"></i>
                    Continue Earning
                </a>
            </div>

            <!-- Tiny footnote -->
            <p class="relative z-10 text-[10px] text-zinc-600 mt-6">
                You will be redirected to the task dashboard.
            </p>
        </div>

        <!-- ===== REMOVED: token badge and bonus nudge card ===== -->
        <!-- Everything else remains -->

    </div>
</main>

<!-- ===== CONFETTI SCRIPT ===== -->
<script>
    (function launchConfetti() {
        const container = document.createElement('div');
        container.className = 'confetti-container';
        document.body.appendChild(container);

        const colors = ['#dc2626', '#ef4444', '#f59e0b', '#10b981', '#34d399', '#3b82f6', '#8b5cf6', '#f472b6', '#fbbf24',
            '#22d3ee'
        ];

        for (let i = 0; i < 120; i++) {
            const piece = document.createElement('div');
            piece.className = 'confetti';
            const size = 6 + Math.random() * 8;
            piece.style.width = size + 'px';
            piece.style.height = size * (0.4 + Math.random() * 0.6) + 'px';
            piece.style.background = colors[Math.floor(Math.random() * colors.length)];
            piece.style.left = Math.random() * 100 + '%';
            piece.style.animationDuration = (2 + Math.random() * 3) + 's';
            piece.style.animationDelay = (Math.random() * 2) + 's';
            piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            piece.style.transform = `rotate(${Math.random() * 360}deg)`;
            container.appendChild(piece);
        }

        // Remove confetti after animation ends
        setTimeout(() => {
            container.remove();
        }, 6000);
    })();

    // Lucide icons
    document.addEventListener('DOMContentLoaded', () => {
        if (window.lucide) lucide.createIcons();
    });
</script>

</body>
</html>
