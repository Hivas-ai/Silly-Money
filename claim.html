<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Complete · RobuxPrize</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b0c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #f1f1f1;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121214;
        }
        ::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 3px;
        }

        /* ===== HEADER (exact copy from app) ===== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            width: 100%;
            border-bottom: 1px solid #27272a;
            background: rgba(24, 24, 27, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 0.75rem 1.5rem;
        }

        .app-header .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: default;
            text-decoration: none;
        }

        .app-header .brand-icon {
            background: #dc2626;
            padding: 0.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.25);
            transition: box-shadow 0.3s;
        }

        .app-header .brand-icon svg {
            width: 1.5rem;
            height: 1.5rem;
            color: white;
        }

        .app-header .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 60%, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header .brand-name .red {
            -webkit-text-fill-color: #dc2626;
            color: #dc2626;
        }

        .app-header .token-pill {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 9999px;
            padding: 0.375rem 1rem 0.375rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8125rem;
            font-weight: 700;
            color: white;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .app-header .token-pill svg {
            width: 1rem;
            height: 1rem;
            color: #dc2626;
        }

        /* ===== MAIN WRAPPER ===== */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            width: 100%;
            max-width: 480px;
        }

        /* ===== CONGRATS CARD ===== */
        .congrats-card {
            width: 100%;
            background: #121214;
            border: 1px solid #27272a;
            border-radius: 2rem;
            padding: 2.75rem 2rem 2.25rem;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        /* subtle gradient accent top */
        .congrats-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #10b981, #34d399, #10b981, transparent);
            opacity: 0.6;
        }

        /* ===== SUCCESS ICON ===== */
        .success-ring {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.08);
            border: 1.5px solid rgba(16, 185, 129, 0.2);
            margin-bottom: 1.25rem;
            position: relative;
            transition: all 0.4s;
        }

        .success-ring .ring-spinner {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: rgba(16, 185, 129, 0.25);
            animation: ringSpin 4s linear infinite;
        }

        .success-ring .ring-spinner:nth-child(2) {
            inset: -8px;
            border-top-color: rgba(16, 185, 129, 0.08);
            animation-duration: 6s;
            animation-direction: reverse;
        }

        @keyframes ringSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .success-ring svg {
            width: 42px;
            height: 42px;
            color: #34d399;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 20px rgba(16, 185, 129, 0.2));
        }

        /* ===== TITLE ===== */
        .congrats-title {
            font-size: 1.625rem;
            font-weight: 900;
            letter-spacing: -0.025em;
            color: #ffffff;
            margin-bottom: 0.35rem;
        }

        .congrats-sub {
            font-size: 0.875rem;
            color: #a1a1aa;
            font-weight: 400;
            line-height: 1.6;
            max-width: 280px;
            margin: 0 auto 0.25rem;
        }

        /* ===== DIVIDER ===== */
        .divider-light {
            width: 48px;
            height: 2px;
            background: #27272a;
            border-radius: 2px;
            margin: 1.25rem auto;
        }

        /* ===== TASK DETAIL PILL ===== */
        .task-detail-row {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #a1a1aa;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 9999px;
            padding: 0.35rem 1.2rem 0.35rem 0.85rem;
            margin: 0 auto 0.5rem;
            transition: border-color 0.2s;
        }

        .task-detail-row svg {
            width: 14px;
            height: 14px;
            color: #52525b;
        }

        .task-detail-row .task-label {
            font-weight: 500;
            color: #d4d4d8;
        }

        /* ===== GREEN CLAIM BUTTON ===== */
        .btn-claim {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            width: 100%;
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.9375rem;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 28px rgba(16, 185, 129, 0.25);
            position: relative;
            overflow: hidden;
            text-decoration: none;
        }

        .btn-claim::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.08));
            pointer-events: none;
        }

        .btn-claim:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(16, 185, 129, 0.35);
            background: linear-gradient(135deg, #047857, #059669);
        }

        .btn-claim:active {
            transform: scale(0.97) translateY(0);
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.2);
        }

        .btn-claim svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .btn-claim .btn-text {
            position: relative;
            z-index: 1;
        }

        /* subtle shimmer on hover */
        .btn-claim::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .btn-claim:hover::before {
            opacity: 1;
        }

        /* ===== TIMER ROW ===== */
        .timer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: #52525b;
            margin-top: 1rem;
            letter-spacing: 0.02em;
        }

        .timer-row svg {
            width: 14px;
            height: 14px;
            color: #52525b;
        }

        .timer-row .time-value {
            color: #a1a1aa;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 1.5rem;
            display: inline-block;
            transition: color 0.3s;
        }

        .timer-row .time-value.warning {
            color: #fbbf24;
        }

        .timer-row .time-value.danger {
            color: #ef4444;
        }

        /* ===== FOOTNOTE ===== */
        .footnote {
            font-size: 0.6rem;
            color: #3f3f46;
            margin-top: 1.25rem;
            letter-spacing: 0.03em;
        }

        .footnote strong {
            color: #52525b;
            font-weight: 500;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app-header {
                padding: 0.6rem 1rem;
            }
            .app-header .brand-name {
                font-size: 1rem;
            }
            .app-header .token-pill {
                font-size: 0.7rem;
                padding: 0.3rem 0.75rem 0.3rem 0.5rem;
            }
            .app-header .brand-icon {
                padding: 0.4rem;
                border-radius: 0.6rem;
            }
            .app-header .brand-icon svg {
                width: 1.2rem;
                height: 1.2rem;
            }

            .main-wrapper {
                padding: 1.25rem 1rem;
            }
            .congrats-card {
                padding: 2rem 1.25rem 1.75rem;
                border-radius: 1.5rem;
            }
            .success-ring {
                width: 72px;
                height: 72px;
            }
            .success-ring svg {
                width: 34px;
                height: 34px;
            }
            .congrats-title {
                font-size: 1.35rem;
            }
            .congrats-sub {
                font-size: 0.8rem;
            }
            .btn-claim {
                font-size: 0.875rem;
                padding: 0.8rem 1.25rem;
            }
            .task-detail-row {
                font-size: 0.7rem;
                padding: 0.25rem 1rem 0.25rem 0.65rem;
            }
        }

        @media (max-width: 380px) {
            .app-header .brand-name {
                font-size: 0.875rem;
            }
            .app-header .token-pill {
                font-size: 0.6rem;
                padding: 0.2rem 0.5rem 0.2rem 0.4rem;
            }
            .app-header .token-pill svg {
                width: 0.75rem;
                height: 0.75rem;
            }
            .congrats-card {
                padding: 1.5rem 1rem 1.5rem;
            }
            .success-ring {
                width: 60px;
                height: 60px;
            }
            .success-ring svg {
                width: 28px;
                height: 28px;
            }
            .congrats-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER (exact copy from app) ===== -->
    <header class="app-header">
        <div class="header-inner">
            <a href="https://robuxprize.site/app.html" class="brand">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                    </svg>
                </div>
                <span class="brand-name">Robux<span class="red">Prize</span></span>
            </a>
            <div class="token-pill">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                </svg>
                <span id="headerTokenCount">5</span> TKNS
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-wrapper">
        <div class="congrats-card">

            <!-- Success icon with animated rings -->
            <div class="success-ring">
                <div class="ring-spinner"></div>
                <div class="ring-spinner"></div>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
            </div>

            <!-- Title -->
            <h1 class="congrats-title">Task Completed</h1>
            <p class="congrats-sub">
                You've successfully finished the required steps. Your reward is ready to be claimed.
            </p>

            <!-- Divider -->
            <div class="divider-light"></div>

            <!-- Task name pill -->
            <div class="task-detail-row">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span class="task-label" id="taskNameDisplay">—</span>
            </div>

            <!-- GREEN Claim button -->
            <a href="https://robuxprize.site/app.html" id="claimButton" class="btn-claim">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
                <span class="btn-text">Claim Reward &amp; Return</span>
            </a>

            <!-- Timer -->
            <div class="timer-row">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2" />
                </svg>
                <span>Claim within</span>
                <span class="time-value" id="countdownDisplay">60</span>
                <span>seconds</span>
            </div>

            <!-- Footnote -->
            <p class="footnote">
                Your progress is synced automatically · <strong>Return to continue earning</strong>
            </p>

        </div>
    </div>

    <!-- ===== SCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ---- Read URL params ----
            const urlParams = new URLSearchParams(window.location.search);

            const taskName = urlParams.get('task') || 'Task';
            const tokenBalance = parseInt(urlParams.get('balance')) || 5;
            const returnUrl = 'https://robuxprize.site/app.html';

            // ---- DOM refs ----
            const taskNameDisplay = document.getElementById('taskNameDisplay');
            const claimBtn = document.getElementById('claimButton');
            const countdownDisplay = document.getElementById('countdownDisplay');
            const headerTokenSpan = document.getElementById('headerTokenCount');

            // ---- Populate header token balance ----
            if (headerTokenSpan) {
                headerTokenSpan.textContent = tokenBalance;
            }

            // ---- Populate task name (clean, truncated) ----
            if (taskNameDisplay) {
                const clean = taskName.length > 36 ? taskName.slice(0, 34) + '…' : taskName;
                taskNameDisplay.textContent = clean;
            }

            // ---- Set the claim button href ----
            if (claimBtn) {
                claimBtn.href = returnUrl;
            }

            // ---- Countdown (60 seconds) ----
            let secondsLeft = 60;
            let timerInterval = null;

            function updateCountdown() {
                if (!countdownDisplay) return;
                countdownDisplay.textContent = secondsLeft;

                // Visual feedback
                countdownDisplay.classList.remove('warning', 'danger');
                if (secondsLeft <= 10) {
                    countdownDisplay.classList.add('danger');
                } else if (secondsLeft <= 30) {
                    countdownDisplay.classList.add('warning');
                }

                if (secondsLeft <= 0) {
                    countdownDisplay.textContent = '0';
                    if (timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                    // Change button appearance when expired
                    if (claimBtn) {
                        claimBtn.style.background = 'linear-gradient(135deg, #3f3f46, #52525b)';
                        claimBtn.style.boxShadow = '0 4px 16px rgba(0,0,0,0.3)';
                        claimBtn.style.cursor = 'pointer';
                        claimBtn.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="width:18px;height:18px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                            <span class="btn-text">Expired · Return</span>
                        `;
                    }
                }
            }

            function startCountdown() {
                updateCountdown();
                timerInterval = setInterval(() => {
                    secondsLeft -= 1;
                    updateCountdown();
                    if (secondsLeft <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                }, 1000);
            }

            startCountdown();

            // ---- If user clicks the claim button, it will navigate to robuxprize.site/app.html ----
            // ---- The button is already an <a> tag with the correct href ----

            console.log(`✅ Task Complete: "${taskName}" | Return: ${returnUrl} | Balance: ${tokenBalance} TKNS`);

        })();
    </script>

</body>
</html>
