<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Completed · Nebsy</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b0c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #f1f1f1;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121214;
        }
        ::-webkit-scrollbar-thumb {
            background: #2563eb;
            border-radius: 3px;
        }

        /* ===== HEADER ===== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            width: 100%;
            border-bottom: 1px solid #27272a;
            background: rgba(24, 24, 27, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 0.75rem 1.5rem;
        }

        .app-header .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: default;
            text-decoration: none;
        }

        .app-header .brand-icon {
            background: #2563eb;
            padding: 0.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
            transition: box-shadow 0.3s;
        }

        .app-header .brand-icon svg {
            width: 1.5rem;
            height: 1.5rem;
            color: white;
        }

        .app-header .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 60%, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== MAIN WRAPPER ===== */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            width: 100%;
            max-width: 480px;
        }

        /* ===== CONGRATS CARD ===== */
        .congrats-card {
            width: 100%;
            background: #121214;
            border: 1px solid #27272a;
            border-radius: 2rem;
            padding: 2.75rem 2rem 2.25rem;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        /* subtle blue gradient accent top */
        .congrats-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #1d4ed8, #60a5fa, #1d4ed8, transparent);
            opacity: 0.6;
        }

        /* ===== SUCCESS ICON ===== */
        .success-ring {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.08);
            border: 1.5px solid rgba(59, 130, 246, 0.2);
            margin-bottom: 1.25rem;
            position: relative;
            transition: all 0.4s;
        }

        .success-ring .ring-spinner {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: rgba(59, 130, 246, 0.25);
            animation: ringSpin 4s linear infinite;
        }

        .success-ring .ring-spinner:nth-child(2) {
            inset: -8px;
            border-top-color: rgba(59, 130, 246, 0.08);
            animation-duration: 6s;
            animation-direction: reverse;
        }

        @keyframes ringSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .success-ring svg {
            width: 42px;
            height: 42px;
            color: #60a5fa;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.2));
        }

        /* ===== TITLE ===== */
        .congrats-title {
            font-size: 1.625rem;
            font-weight: 900;
            letter-spacing: -0.025em;
            color: #ffffff;
            margin-bottom: 0.35rem;
        }

        .congrats-sub {
            font-size: 0.875rem;
            color: #a1a1aa;
            font-weight: 400;
            line-height: 1.6;
            max-width: 280px;
            margin: 0 auto 0.25rem;
        }

        /* ===== DIVIDER ===== */
        .divider-light {
            width: 48px;
            height: 2px;
            background: #27272a;
            border-radius: 2px;
            margin: 1.25rem auto;
        }

        /* ===== TASK DETAIL PILL ===== */
        .task-detail-row {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #a1a1aa;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 9999px;
            padding: 0.35rem 1.2rem 0.35rem 0.85rem;
            margin: 0 auto 0.5rem;
            transition: border-color 0.2s;
        }

        .task-detail-row svg {
            width: 14px;
            height: 14px;
            color: #52525b;
        }

        .task-detail-row .task-label {
            font-weight: 500;
            color: #d4d4d8;
        }

        /* ===== BLUE BACK BUTTON ===== */
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            width: 100%;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.9375rem;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 28px rgba(37, 99, 235, 0.25);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            margin-top: 1.25rem;
            font-family: 'Inter', sans-serif;
        }

        .btn-back::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.08));
            pointer-events: none;
        }

        .btn-back:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(37, 99, 235, 0.35);
            background: linear-gradient(135deg, #1e40af, #2563eb);
        }

        .btn-back:active {
            transform: scale(0.97) translateY(0);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.2);
        }

        .btn-back svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .btn-back .btn-text {
            position: relative;
            z-index: 1;
        }

        /* subtle shimmer on hover */
        .btn-back::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .btn-back:hover::before {
            opacity: 1;
        }

        /* ===== FOOTNOTE ===== */
        .footnote {
            font-size: 0.6rem;
            color: #3f3f46;
            margin-top: 1.25rem;
            letter-spacing: 0.03em;
        }

        .footnote strong {
            color: #52525b;
            font-weight: 500;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app-header {
                padding: 0.6rem 1rem;
            }
            .app-header .brand-name {
                font-size: 1rem;
            }
            .app-header .brand-icon {
                padding: 0.4rem;
                border-radius: 0.6rem;
            }
            .app-header .brand-icon svg {
                width: 1.2rem;
                height: 1.2rem;
            }

            .main-wrapper {
                padding: 1.25rem 1rem;
            }
            .congrats-card {
                padding: 2rem 1.25rem 1.75rem;
                border-radius: 1.5rem;
            }
            .success-ring {
                width: 72px;
                height: 72px;
            }
            .success-ring svg {
                width: 34px;
                height: 34px;
            }
            .congrats-title {
                font-size: 1.35rem;
            }
            .congrats-sub {
                font-size: 0.8rem;
            }
            .btn-back {
                font-size: 0.875rem;
                padding: 0.8rem 1.25rem;
            }
            .task-detail-row {
                font-size: 0.7rem;
                padding: 0.25rem 1rem 0.25rem 0.65rem;
            }
        }

        @media (max-width: 380px) {
            .app-header .brand-name {
                font-size: 0.875rem;
            }
            .congrats-card {
                padding: 1.5rem 1rem 1.5rem;
            }
            .success-ring {
                width: 60px;
                height: 60px;
            }
            .success-ring svg {
                width: 28px;
                height: 28px;
            }
            .congrats-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="header-inner">
            <a href="#" class="brand" onclick="return false;">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                    </svg>
                </div>
                <span class="brand-name">Nebsy</span>
            </a>
            <!-- Token pill removed -->
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-wrapper">
        <div class="congrats-card">

            <!-- Success icon with animated rings -->
            <div class="success-ring">
                <div class="ring-spinner"></div>
                <div class="ring-spinner"></div>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
            </div>

            <!-- Title -->
            <h1 class="congrats-title">Task Completed Successfully</h1>
            <p class="congrats-sub">
                Your task has been completed successfully. Nothing else is needed — you can head back now.
            </p>

            <!-- Divider -->
            <div class="divider-light"></div>

            <!-- Task name pill -->
            <div class="task-detail-row">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span class="task-label" id="taskNameDisplay">—</span>
            </div>

            <!-- BLUE Back button -->
            <button type="button" id="backButton" class="btn-back">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" />
                </svg>
                <span class="btn-text">Back</span>
            </button>

            <!-- Footnote -->
            <p class="footnote">
                Your progress is synced automatically · <strong>You can safely go back</strong>
            </p>

        </div>
    </div>

    <!-- ===== SCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ---- Read URL params ----
            const urlParams = new URLSearchParams(window.location.search);
            const taskName = urlParams.get('task') || 'Task';

            // ---- DOM refs ----
            const taskNameDisplay = document.getElementById('taskNameDisplay');
            const backBtn = document.getElementById('backButton');

            // ---- Populate task name (clean, truncated) ----
            if (taskNameDisplay) {
                const clean = taskName.length > 36 ? taskName.slice(0, 34) + '…' : taskName;
                taskNameDisplay.textContent = clean;
            }

            // ---- Back button: simply go back in history ----
            if (backBtn) {
                backBtn.addEventListener('click', function() {
                    if (window.history.length > 1) {
                        window.history.back();
                    } else {
                        window.close();
                    }
                });
            }

            console.log(`✅ Task completed successfully: "${taskName}"`);

        })();
    </script>

</body>
</html>
