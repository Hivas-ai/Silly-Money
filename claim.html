<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Complete · RobuxPrize</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b0c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #f1f1f1;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121214;
        }
        ::-webkit-scrollbar-thumb {
            background: #dc2626;
            border-radius: 3px;
        }

        /* ---- Header (exact copy from app) ---- */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            width: 100%;
            border-bottom: 1px solid #27272a;
            background: rgba(24, 24, 27, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0.75rem 1.5rem;
        }

        .app-header .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: default;
        }

        .app-header .brand-icon {
            background: #dc2626;
            padding: 0.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(220, 38, 38, 0.2);
        }

        .app-header .brand-icon svg {
            width: 1.5rem;
            height: 1.5rem;
            color: white;
        }

        .app-header .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 60%, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .app-header .brand-name span {
            color: #dc2626;
            -webkit-text-fill-color: #dc2626;
        }

        .app-header .token-pill {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 9999px;
            padding: 0.375rem 1rem 0.375rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8125rem;
            font-weight: 700;
            color: white;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.4);
        }

        .app-header .token-pill svg {
            width: 1rem;
            height: 1rem;
            color: #dc2626;
        }

        /* ---- Main card ---- */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            width: 100%;
            max-width: 480px;
        }

        .congrats-card {
            width: 100%;
            background: #121214;
            border: 1px solid #27272a;
            border-radius: 2rem;
            padding: 2.75rem 2rem 2.25rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            text-align: center;
            transition: all 0.2s;
        }

        /* ---- Success icon (professional) ---- */
        .success-ring {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(16, 185, 129, 0.08);
            border: 1.5px solid rgba(16, 185, 129, 0.2);
            margin-bottom: 1.5rem;
            position: relative;
        }

        .success-ring::after {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: rgba(16, 185, 129, 0.2);
            animation: ringSpin 4s linear infinite;
        }

        @keyframes ringSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .success-ring svg {
            width: 40px;
            height: 40px;
            color: #34d399;
            stroke-width: 2.5;
        }

        /* ---- Title ---- */
        .congrats-title {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #ffffff;
            margin-bottom: 0.25rem;
        }

        .congrats-sub {
            font-size: 0.875rem;
            color: #a1a1aa;
            font-weight: 400;
            line-height: 1.6;
            max-width: 280px;
            margin: 0 auto 0.5rem;
        }

        /* ---- Divider ---- */
        .divider-light {
            width: 48px;
            height: 2px;
            background: #27272a;
            border-radius: 2px;
            margin: 1.25rem auto;
        }

        /* ---- Task detail row ---- */
        .task-detail-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #52525b;
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 9999px;
            padding: 0.3rem 1.2rem 0.3rem 0.8rem;
            margin: 0 auto 0.5rem;
            width: fit-content;
        }

        .task-detail-row svg {
            width: 14px;
            height: 14px;
            color: #52525b;
        }

        .task-detail-row .task-label {
            color: #a1a1aa;
            font-weight: 500;
        }

        /* ---- Claim button (professional) ---- */
        .btn-claim {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            width: 100%;
            background: #dc2626;
            border: none;
            padding: 0.85rem 1.5rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.9375rem;
            color: white;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 24px rgba(220, 38, 38, 0.2);
            margin-top: 1.5rem;
            text-decoration: none;
        }

        .btn-claim:hover {
            background: #ef4444;
            transform: translateY(-1px);
            box-shadow: 0 10px 32px rgba(220, 38, 38, 0.3);
        }

        .btn-claim:active {
            transform: scale(0.98);
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.2);
        }

        .btn-claim svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        /* ---- Timer row ---- */
        .timer-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.7rem;
            color: #52525b;
            margin-top: 1rem;
            letter-spacing: 0.02em;
        }

        .timer-row svg {
            width: 14px;
            height: 14px;
            color: #52525b;
        }

        .timer-row .time-value {
            color: #a1a1aa;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            min-width: 1.5rem;
            display: inline-block;
        }

        .timer-row .time-value.warning {
            color: #fbbf24;
        }

        .timer-row .time-value.danger {
            color: #ef4444;
        }

        /* ---- Small footer note ---- */
        .footnote {
            font-size: 0.6rem;
            color: #3f3f46;
            margin-top: 1.25rem;
            letter-spacing: 0.03em;
        }

        /* ---- Responsive ---- */
        @media (max-width: 480px) {
            .app-header {
                padding: 0.6rem 1rem;
            }
            .app-header .brand-name {
                font-size: 1rem;
            }
            .app-header .token-pill {
                font-size: 0.7rem;
                padding: 0.3rem 0.75rem 0.3rem 0.5rem;
            }
            .app-header .brand-icon {
                padding: 0.4rem;
                border-radius: 0.6rem;
            }
            .app-header .brand-icon svg {
                width: 1.2rem;
                height: 1.2rem;
            }

            .main-wrapper {
                padding: 1.25rem 1rem;
            }
            .congrats-card {
                padding: 2rem 1.25rem 1.75rem;
                border-radius: 1.5rem;
            }
            .success-ring {
                width: 64px;
                height: 64px;
            }
            .success-ring svg {
                width: 32px;
                height: 32px;
            }
            .congrats-title {
                font-size: 1.25rem;
            }
            .congrats-sub {
                font-size: 0.8rem;
            }
            .btn-claim {
                font-size: 0.875rem;
                padding: 0.75rem 1.25rem;
            }
            .task-detail-row {
                font-size: 0.7rem;
                padding: 0.2rem 1rem 0.2rem 0.6rem;
            }
        }

        @media (max-width: 380px) {
            .app-header .brand-name {
                font-size: 0.875rem;
            }
            .app-header .token-pill {
                font-size: 0.6rem;
                padding: 0.2rem 0.5rem 0.2rem 0.4rem;
            }
            .app-header .token-pill svg {
                width: 0.75rem;
                height: 0.75rem;
            }
            .congrats-card {
                padding: 1.5rem 1rem 1.5rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER (exact copy from app) ===== -->
    <header class="app-header">
        <div class="header-inner">
            <div class="brand">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                    </svg>
                </div>
                <span class="brand-name">Robux<span>Prize</span></span>
            </div>
            <div class="token-pill">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                </svg>
                <span id="headerTokenCount">5</span> TKNS
            </div>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-wrapper">
        <div class="congrats-card">

            <!-- Success icon -->
            <div class="success-ring">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
                </svg>
            </div>

            <!-- Title -->
            <h1 class="congrats-title">Task Completed</h1>
            <p class="congrats-sub">
                You've successfully finished the required steps. Your reward is ready to be claimed.
            </p>

            <!-- Divider -->
            <div class="divider-light"></div>

            <!-- Task name pill -->
            <div class="task-detail-row">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span class="task-label" id="taskNameDisplay">—</span>
            </div>

            <!-- Claim button -->
            <button id="claimButton" class="btn-claim">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
                </svg>
                Claim Reward &amp; Return
            </button>

            <!-- Timer -->
            <div class="timer-row">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2" />
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6l4 2" />
                </svg>
                <span>Claim within</span>
                <span class="time-value" id="countdownDisplay">60</span>
                <span>seconds</span>
            </div>

            <!-- Footnote -->
            <p class="footnote">Your progress is synced automatically · Return to continue earning</p>

        </div>
    </div>

    <!-- ===== SCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ---- Read URL params ----
            const urlParams = new URLSearchParams(window.location.search);

            const taskName = urlParams.get('task') || 'Task';
            const returnUrl = urlParams.get('return') || 'index.html';
            const tokenBalance = parseInt(urlParams.get('balance')) || 5;

            // ---- DOM refs ----
            const taskNameDisplay = document.getElementById('taskNameDisplay');
            const claimBtn = document.getElementById('claimButton');
            const countdownDisplay = document.getElementById('countdownDisplay');
            const headerTokenSpan = document.getElementById('headerTokenCount');

            // ---- Populate header token balance ----
            if (headerTokenSpan) {
                headerTokenSpan.textContent = tokenBalance;
            }

            // ---- Populate task name (clean, truncated) ----
            if (taskNameDisplay) {
                const clean = taskName.length > 32 ? taskName.slice(0, 30) + '…' : taskName;
                taskNameDisplay.textContent = clean;
            }

            // ---- Countdown (60 seconds) ----
            let secondsLeft = 60;
            let timerInterval = null;

            function updateCountdown() {
                if (!countdownDisplay) return;
                countdownDisplay.textContent = secondsLeft;

                // Visual feedback
                countdownDisplay.classList.remove('warning', 'danger');
                if (secondsLeft <= 10) {
                    countdownDisplay.classList.add('danger');
                } else if (secondsLeft <= 30) {
                    countdownDisplay.classList.add('warning');
                }

                if (secondsLeft <= 0) {
                    countdownDisplay.textContent = '0';
                    if (timerInterval) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                    // Optionally change button text
                    if (claimBtn) {
                        claimBtn.innerHTML = `
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" style="width:18px;height:18px;">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                            </svg>
                            Expired · Return
                        `;
                        claimBtn.style.opacity = '0.6';
                        claimBtn.style.background = '#3f3f46';
                        claimBtn.style.cursor = 'pointer';
                    }
                }
            }

            function startCountdown() {
                updateCountdown();
                timerInterval = setInterval(() => {
                    secondsLeft -= 1;
                    updateCountdown();
                    if (secondsLeft <= 0) {
                        clearInterval(timerInterval);
                        timerInterval = null;
                    }
                }, 1000);
            }

            startCountdown();

            // ---- Claim button handler ----
            if (claimBtn) {
                claimBtn.addEventListener('click', function(e) {
                    e.preventDefault();

                    // If expired, just redirect back
                    if (secondsLeft <= 0) {
                        window.location.href = returnUrl;
                        return;
                    }

                    // Otherwise, redirect to the return URL
                    window.location.href = returnUrl;
                });
            }

            // ---- Small trick: if user clicks the card background, it's fine ----
            console.log(`✅ Task Complete: "${taskName}" | Return: ${returnUrl} | Balance: ${tokenBalance} TKNS`);

        })();
    </script>

</body>
</html>
