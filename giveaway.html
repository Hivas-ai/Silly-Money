<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Claim 250 Tkns · Nebsy Giveaway</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4">
    </script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #0b0b0c;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #f1f1f1;
            -webkit-font-smoothing: antialiased;
        }

        /* ---- Scrollbar ---- */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #121214;
        }
        ::-webkit-scrollbar-thumb {
            background: #2563eb;
            border-radius: 3px;
        }

        /* ===== HEADER ===== */
        .app-header {
            position: sticky;
            top: 0;
            z-index: 50;
            width: 100%;
            border-bottom: 1px solid #27272a;
            background: rgba(24, 24, 27, 0.88);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            padding: 0.75rem 1.5rem;
        }

        .app-header .header-inner {
            max-width: 1280px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-header .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: default;
            text-decoration: none;
        }

        .app-header .brand-icon {
            background: #2563eb;
            padding: 0.5rem;
            border-radius: 0.75rem;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.25);
            transition: box-shadow 0.3s;
        }

        .app-header .brand-icon svg {
            width: 1.5rem;
            height: 1.5rem;
            color: white;
        }

        .app-header .brand-name {
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            background: linear-gradient(135deg, #ffffff 60%, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* ===== MAIN WRAPPER ===== */
        .main-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
            width: 100%;
            max-width: 480px;
        }

        /* ===== GIVEAWAY CARD ===== */
        .congrats-card {
            width: 100%;
            background: #121214;
            border: 1px solid #27272a;
            border-radius: 2rem;
            padding: 2.75rem 2rem 2.25rem;
            box-shadow:
                0 30px 60px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            text-align: center;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }

        /* subtle blue gradient accent top */
        .congrats-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, #1d4ed8, #60a5fa, #1d4ed8, transparent);
            opacity: 0.6;
        }

        /* ===== SUCCESS / GIFT ICON ===== */
        .success-ring {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: rgba(59, 130, 246, 0.08);
            border: 1.5px solid rgba(59, 130, 246, 0.2);
            margin-bottom: 1.25rem;
            position: relative;
            transition: all 0.4s;
        }

        .success-ring .ring-spinner {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            border: 1.5px solid transparent;
            border-top-color: rgba(59, 130, 246, 0.25);
            animation: ringSpin 4s linear infinite;
        }

        .success-ring .ring-spinner:nth-child(2) {
            inset: -8px;
            border-top-color: rgba(59, 130, 246, 0.08);
            animation-duration: 6s;
            animation-direction: reverse;
        }

        @keyframes ringSpin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        .success-ring svg {
            width: 42px;
            height: 42px;
            color: #60a5fa;
            stroke-width: 2.2;
            filter: drop-shadow(0 0 20px rgba(59, 130, 246, 0.2));
        }

        /* ===== TITLE ===== */
        .congrats-title {
            font-size: 1.625rem;
            font-weight: 900;
            letter-spacing: -0.025em;
            color: #ffffff;
            margin-bottom: 0.35rem;
        }

        .congrats-sub {
            font-size: 0.875rem;
            color: #a1a1aa;
            font-weight: 400;
            line-height: 1.6;
            max-width: 320px;
            margin: 0 auto 0.25rem;
        }

        /* ===== DIVIDER ===== */
        .divider-light {
            width: 48px;
            height: 2px;
            background: #27272a;
            border-radius: 2px;
            margin: 1.25rem auto;
        }

        /* ===== CODE BADGE ===== */
        .code-badge {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            background: #18181b;
            border: 1px dashed rgba(59, 130, 246, 0.35);
            border-radius: 1rem;
            padding: 0.7rem 0.7rem 0.7rem 0.5rem;
            margin: 0 auto 0.75rem;
            transition: border-color 0.25s;
        }

        .code-badge:hover {
            border-color: rgba(59, 130, 246, 0.6);
        }

        .code-value {
            flex: 1;
            text-align: center;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 1.45rem;
            font-weight: 800;
            letter-spacing: 0.3em;
            padding-left: 0.3em;
            color: #60a5fa;
            text-shadow: 0 0 24px rgba(59, 130, 246, 0.35);
            user-select: all;
        }

        .copy-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(59, 130, 246, 0.1);
            border: 1px solid rgba(59, 130, 246, 0.25);
            color: #93c5fd;
            font-family: 'Inter', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.4rem 0.65rem;
            border-radius: 0.6rem;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .copy-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            color: #bfdbfe;
        }

        .copy-btn:active {
            transform: scale(0.95);
        }

        .copy-btn svg {
            width: 13px;
            height: 13px;
        }

        .copy-btn.copied {
            background: rgba(34, 197, 94, 0.12);
            border-color: rgba(34, 197, 94, 0.35);
            color: #86efac;
        }

        /* ===== FEEDBACK MESSAGE ===== */
        .feedback {
            font-size: 0.75rem;
            min-height: 1.2rem;
            color: #a1a1aa;
            transition: color 0.2s;
            text-align: center;
            margin-top: 0.5rem;
        }

        .feedback.success {
            color: #86efac;
        }

        /* ===== BLUE PRIMARY BUTTON ===== */
        .btn-back {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
            width: 100%;
            background: linear-gradient(135deg, #1d4ed8, #3b82f6);
            border: none;
            padding: 0.9rem 1.5rem;
            border-radius: 9999px;
            font-weight: 700;
            font-size: 0.9375rem;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 6px 28px rgba(37, 99, 235, 0.25);
            position: relative;
            overflow: hidden;
            text-decoration: none;
            margin-top: 0.75rem;
            font-family: 'Inter', sans-serif;
        }

        .btn-back::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, transparent, rgba(255, 255, 255, 0.08));
            pointer-events: none;
        }

        .btn-back:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(37, 99, 235, 0.35);
            background: linear-gradient(135deg, #1e40af, #2563eb);
        }

        .btn-back:active:not(:disabled) {
            transform: scale(0.97) translateY(0);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.2);
        }

        .btn-back:disabled {
            opacity: 0.6;
            cursor: default;
            transform: none;
        }

        .btn-back svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            position: relative;
            z-index: 1;
        }

        .btn-back .btn-text {
            position: relative;
            z-index: 1;
        }

        /* subtle shimmer on hover */
        .btn-back::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 50%, rgba(255, 255, 255, 0.06), transparent 60%);
            opacity: 0;
            transition: opacity 0.5s;
            pointer-events: none;
        }

        .btn-back:hover:not(:disabled)::before {
            opacity: 1;
        }

        /* ===== FOOTNOTE ===== */
        .footnote {
            font-size: 0.6rem;
            color: #3f3f46;
            margin-top: 1.25rem;
            letter-spacing: 0.03em;
            line-height: 1.7;
        }

        .footnote strong {
            color: #52525b;
            font-weight: 500;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 480px) {
            .app-header {
                padding: 0.6rem 1rem;
            }
            .app-header .brand-name {
                font-size: 1rem;
            }
            .app-header .brand-icon {
                padding: 0.4rem;
                border-radius: 0.6rem;
            }
            .app-header .brand-icon svg {
                width: 1.2rem;
                height: 1.2rem;
            }

            .main-wrapper {
                padding: 1.25rem 1rem;
            }
            .congrats-card {
                padding: 2rem 1.25rem 1.75rem;
                border-radius: 1.5rem;
            }
            .success-ring {
                width: 72px;
                height: 72px;
            }
            .success-ring svg {
                width: 34px;
                height: 34px;
            }
            .congrats-title {
                font-size: 1.35rem;
            }
            .congrats-sub {
                font-size: 0.8rem;
            }
            .btn-back {
                font-size: 0.875rem;
                padding: 0.8rem 1.25rem;
            }
            .code-value {
                font-size: 1.2rem;
                letter-spacing: 0.22em;
                padding-left: 0.22em;
            }
            .copy-btn {
                font-size: 0.65rem;
                padding: 0.35rem 0.55rem;
            }
        }

        @media (max-width: 380px) {
            .app-header .brand-name {
                font-size: 0.875rem;
            }
            .congrats-card {
                padding: 1.5rem 1rem 1.5rem;
            }
            .success-ring {
                width: 60px;
                height: 60px;
            }
            .success-ring svg {
                width: 28px;
                height: 28px;
            }
            .congrats-title {
                font-size: 1.1rem;
            }
            .code-value {
                font-size: 1.05rem;
                letter-spacing: 0.18em;
                padding-left: 0.18em;
            }
            .copy-btn .copy-text {
                display: none;
            }
        }
    </style>
</head>
<body>

    <!-- ===== HEADER ===== -->
    <header class="app-header">
        <div class="header-inner">
            <a href="#" class="brand" onclick="return false;">
                <div class="brand-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 5v2m0 4v2m0 4v2M5 5a2 2 0 00-2 2v3a2 2 0 110 4v3a2 2 0 002 2h14a2 2 0 002-2v-3a2 2 0 110-4V7a2 2 0 00-2-2H5z" />
                    </svg>
                </div>
                <span class="brand-name">Nebsy</span>
            </a>
        </div>
    </header>

    <!-- ===== MAIN CONTENT ===== -->
    <div class="main-wrapper">
        <div class="congrats-card">

            <!-- Gift icon with animated rings -->
            <div class="success-ring">
                <div class="ring-spinner"></div>
                <div class="ring-spinner"></div>
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 11.25v8.25a1.5 1.5 0 01-1.5 1.5H4.5a1.5 1.5 0 01-1.5-1.5v-8.25M12 4.875A2.625 2.625 0 109.375 7.5H12m0-2.625V7.5m0-2.625A2.625 2.625 0 1114.625 7.5H12m0 0V21m-8.625-9.75h18c.621 0 1.125-.504 1.125-1.125v-1.5c0-.621-.504-1.125-1.125-1.125h-18c-.621 0-1.125.504-1.125 1.125v1.5c0 .621.504 1.125 1.125 1.125z" />
                </svg>
            </div>

            <!-- Title -->
            <h1 class="congrats-title">Congratulations! 🎉</h1>
            <p class="congrats-sub">
                You've won <strong style="color:#93c5fd;font-weight:600;">250 Tkns</strong> in the Nebsy giveaway!<br />
                Copy the code below and claim your reward.
            </p>

            <!-- Divider -->
            <div class="divider-light"></div>

            <!-- Code badge -->
            <div class="code-badge">
                <span class="code-value" id="codeValue">7T4N5</span>
                <button type="button" class="copy-btn" id="copyBtn" aria-label="Copy code">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376h3.375c.621 0 1.125-.504 1.125-1.125V11.25c0-4.46-3.243-8.161-7.5-8.876a9.06 9.06 0 00-1.5-.124H9.375c-.621 0-1.125.504-1.125 1.125v3.5m7.5 10.375H9.375a1.125 1.125 0 01-1.125-1.125v-9.25m12 6.625v-1.875a3.375 3.375 0 00-3.375-3.375h-1.5a1.125 1.125 0 01-1.125-1.125v-1.5a3.375 3.375 0 00-3.375-3.375H9.75" />
                    </svg>
                    <span class="copy-text" id="copyText">Copy</span>
                </button>
            </div>

            <!-- Claim button -->
            <button type="button" id="claimButton" class="btn-back">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
                </svg>
                <span class="btn-text">Get Your 250 Tkns Now</span>
            </button>

            <!-- Feedback message (hidden by default, shown on claim) -->
            <div class="feedback" id="feedback"></div>

            <!-- Footnote -->
            <p class="footnote">
                Your reward will be credited after verification · <strong>Nebsy Technologies</strong>
            </p>

        </div>
    </div>

    <!-- ===== SCRIPT ===== -->
    <script>
        (function() {
            'use strict';

            // ---- Giveaway config ----
            const CODE = '7T4N5';

            // ---- DOM refs ----
            const claimBtn = document.getElementById('claimButton');
            const feedback = document.getElementById('feedback');
            const copyBtn = document.getElementById('copyBtn');
            const copyText = document.getElementById('copyText');
            const codeValue = document.getElementById('codeValue');

            // ---- Copy code to clipboard (shared function) ----
            function copyCodeToClipboard() {
                const code = CODE;
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    return navigator.clipboard.writeText(code);
                } else {
                    return new Promise(function(resolve, reject) {
                        const ta = document.createElement('textarea');
                        ta.value = code;
                        ta.style.position = 'fixed';
                        ta.style.opacity = '0';
                        document.body.appendChild(ta);
                        ta.select();
                        try {
                            document.execCommand('copy');
                            resolve();
                        } catch (e) {
                            reject(e);
                        }
                        document.body.removeChild(ta);
                    });
                }
            }

            // ---- Copy button handler ----
            if (copyBtn && codeValue) {
                copyBtn.addEventListener('click', function() {
                    copyCodeToClipboard().then(function() {
                        copyBtn.classList.add('copied');
                        const original = copyText ? copyText.textContent : '';
                        if (copyText) copyText.textContent = 'Copied!';
                        setTimeout(function() {
                            copyBtn.classList.remove('copied');
                            if (copyText) copyText.textContent = original || 'Copy';
                        }, 1800);
                    }).catch(function() {
                        // ignore
                    });
                });
            }

            // ---- Claim button handler ----
            if (claimBtn && feedback) {
                claimBtn.addEventListener('click', function() {
                    copyCodeToClipboard().then(function() {
                        feedback.textContent = '✅ Code copied! Your 250 Tkns will be credited shortly.';
                        feedback.className = 'feedback success';

                        // Temporarily change button text
                        const btnText = claimBtn.querySelector('.btn-text');
                        const originalText = btnText.textContent;
                        btnText.textContent = 'Code Copied!';
                        claimBtn.disabled = true;

                        setTimeout(function() {
                            btnText.textContent = originalText;
                            claimBtn.disabled = false;
                            feedback.textContent = '';
                            feedback.className = 'feedback';
                        }, 3000);
                    }).catch(function() {
                        feedback.textContent = '❌ Could not copy code. Please copy it manually.';
                        feedback.className = 'feedback error';
                        setTimeout(function() {
                            feedback.textContent = '';
                            feedback.className = 'feedback';
                        }, 3000);
                    });
                });
            }

            console.log('🎁 Nebsy giveaway ready — code: ' + CODE);

        })();
    </script>

</body>
</html>
