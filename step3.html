<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silly Prize - Download</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #0f0f23;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .container {
            text-align: center;
            padding: 2rem;
        }

        .app-name {
            color: #fff;
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -1px;
        }

        .tagline {
            color: #8892b0;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #2563eb;
            color: white;
            font-size: 1.2rem;
            font-weight: 600;
            padding: 18px 48px;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
        }

        .download-btn:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.6);
        }

        .download-btn:active {
            transform: translateY(0);
        }

        .download-icon {
            width: 24px;
            height: 24px;
        }

        .subtitle {
            color: #64748b;
            font-size: 0.9rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="app-name">Silly Prize</h1>
        <p class="tagline">Play to Earn. Task. Withdraw. Repeat.</p>
        
        <a href="https://play.google.com/store/apps/details?id=silly.prize&hl=en" class="download-btn">
            <svg class="download-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                      d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4">
                </path>
            </svg>
            Download Now
        </a>
        
        <p class="subtitle">Available for Android</p>
    </div>
</body>
</html>
